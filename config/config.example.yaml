# OpenEOS Printer Agent - configuration
#
# The only required setting is server_url. Printers are NOT configured here:
# the agent finds USB and network printers itself and reports them to the
# platform; an admin adopts them in the web app under "Drucker".
#
# Locations searched (first hit wins): --config FILE,
#   Linux:   /var/lib/openeos-printer/config.yaml, ./config/config.yaml,
#            /etc/openeos-printer/config.yaml, ~/.config/openeos-printer/config.yaml
#   Windows: %ProgramData%\OpenEOS Printer Agent\config.yaml, .\config\config.yaml

# Base URL of the OpenEOS API, including the /api prefix.
server_url: "https://api.openeos.de/api"

# Optional: pre-provisioned device token. Leave unset - the agent pairs
# itself on first start (6-digit code in the log and on http://localhost:8080)
# and stores the token in the data directory.
# device_token: ""

# Optional overrides. Defaults: Linux /var/lib/openeos-printer (or
# ~/.local/share/openeos-printer), Windows %ProgramData%\OpenEOS Printer Agent.
# data_dir: "/var/lib/openeos-printer"

logging:
  level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  # dir: "/var/log/openeos-printer"   # rotating agent.log (10 MB x 5)

local_server:
  enabled: true            # status page + pairing code on http://<host>:8080
  host: "0.0.0.0"
  port: 8080

discovery:
  interval_s: 300          # automatic scan every 5 minutes
  # subnet: "192.168.1.0/24"        # /24 for the port-9100 scan (default: own interface)
  # subnet_scan_on_schedule: false  # port scan also on the automatic runs
  # probe_timeout_s: 1.0            # ESC/POS model query (GS I) per network device

# Cash-drawer kick pin (2 for most Epson drawers, some use 5).
cash_drawer_pin: 2
