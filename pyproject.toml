[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeos-printer-agent"
version = "0.1.0"
description = "OpenEOS Printer Agent - ESC/POS printer control via WebSocket"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Die Statusseite traegt ihr HTML und CSS als Zeichenketten im Quelltext.
# Die auf 120 Zeichen umzubrechen macht den Code nicht lesbarer, sondern
# zerlegt Markup an willkuerlichen Stellen.
"src/local_server.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
