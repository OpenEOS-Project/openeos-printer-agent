[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeos-printer-agent"
dynamic = ["version"]
description = "OpenEOS Printer Agent - finds USB/network receipt printers and prints ESC/POS jobs from the OpenEOS platform"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "LUXCODE by Lukas Lukic-Spitznagel"}]
# Kept in sync with requirements.txt (install.sh / Docker use the txt file,
# `pip install .` and PyInstaller use this list).
dependencies = [
    "python-socketio[asyncio]>=5.17.0,<6.0",
    "aiohttp>=3.9,<4.0",
    "python-escpos>=3.1,<4.0",
    "pyusb>=1.2,<2.0",
    "zeroconf>=0.130,<1.0",
    "platformdirs>=4.0,<5.0",
    "Jinja2>=3.1.6,<4.0",
    "PyYAML>=6.0,<7.0",
    "Pillow>=10.0,<13.0",
    "qrcode[pil]>=8.2,<9.0",
    "psutil>=5.9,<6.0",
    "pydantic>=2.0,<3.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
openeos-printer-agent = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.discovery"]

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.setuptools.package-data]
src = ["templates/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Die Statusseite traegt ihr HTML und CSS als Zeichenketten im Quelltext.
# Die auf 120 Zeichen umzubrechen macht den Code nicht lesbarer, sondern
# zerlegt Markup an willkuerlichen Stellen.
"src/local_server.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Keine Typstubs vorhanden (oder gar kein echtes Paket, siehe "distro" unten,
# das nur optional in system_monitor.py importiert wird) - ohne diese
# Ausnahmen waere jede Verwendung dieser Bibliotheken ein Fehler, obwohl der
# Code selbst korrekt ist.
[[tool.mypy.overrides]]
module = [
    "yaml",
    "psutil",
    "qrcode",
    "distro",
    "escpos.*",
    "socketio",
    "barcode",
    "barcode.*",
    "usb.*",
    "libusb_package",
    "win32print",
    "win32service",
    "win32serviceutil",
    "win32event",
    "servicemanager",
]
ignore_missing_imports = true

# socketio.AsyncClient.event/.on sind selbst ungetypt (siehe oben), daher
# macht strict's disallow_untyped_decorators aus jedem damit dekorierten
# Handler einen Fehler, sobald der Handler selbst annotiert ist - das waere
# das Gegenteil des Ziels dieser Datei. Der Rest der strict-Regeln bleibt an.
[[tool.mypy.overrides]]
module = "src.websocket_client"
disallow_untyped_decorators = false

# win32serviceutil.ServiceFramework ist ungetypt; die Service-Klasse erbt
# davon und ist auf Linux gar nicht importierbar.
[[tool.mypy.overrides]]
module = "src.windows_service"
disallow_subclassing_any = true
warn_unused_ignores = false
