name: Tests und Codepruefung

# Der Agent hatte bisher keine CI, obwohl pytest, ruff und mypy in
# pyproject.toml konfiguriert sind und Tests existieren. Die Folge war
# absehbar: Die Tests waren reihenweise rot, weil ein Feld im Konfigurations-
# modell umbenannt und Vorlagen umbenannt wurden, ohne dass es jemand
# bemerkte. Genau dagegen laeuft dieser Workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die dokumentierte Mindestversion, 3.12 faengt fruehzeitig
        # ab, was beim naechsten Sprung auf den Raspberry Pis kaputtginge.
        # Windows laeuft mit, weil der Agent dort als Dienst installiert wird
        # (Spooler-Discovery, Pfade, Signalbehandlung ohne add_signal_handler).
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        env:
          # Ein Vorlagen-Test formatiert UTC-Zeitstempel in Ortszeit;
          # die Runner laufen in UTC, lokal setzt man TZ=UTC genauso.
          TZ: UTC
        run: python -m pytest -q --cov=src --cov-report=term-missing

  package:
    name: pip install . und Binaerdatei
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: pip install .
        run: |
          python -m pip install --upgrade pip
          pip install .
          openeos-printer-agent --version
          openeos-printer-agent install-service || test $? -eq 2

      - name: PyInstaller-Rauchtest
        run: |
          pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm openeos-printer-agent.spec
          dist/openeos-printer-agent --version

  lint:
    name: Codepruefung
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: python -m ruff check .

      - name: ruff format
        run: python -m ruff format --check .

      # Blockierend seit #8: der Bestand ist jetzt vollstaendig annotiert
      # (0 Fehler), also faengt das Gate ab jetzt echte Regressionen ab,
      # statt sie nur zu protokollieren.
      - name: mypy
        run: python -m mypy src

  docker:
    name: Abbild baut
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Abbild bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          # Bewusst nur bauen, nicht veroeffentlichen: Der Agent wird auf den
          # Geraeten aus dem Quelltext installiert, nicht aus einem Registry.
          push: false

  # SBOM (CycloneDX) der Laufzeit-Abhaengigkeiten, wie sie install.sh auf
  # den Geraeten installiert, als Build-Artefakt. Vorbereitung auf den
  # Cyber Resilience Act (Anhang I Teil II, ab 12/2027).
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: SBOM erzeugen
        run: |
          python -m venv /tmp/agent-env
          /tmp/agent-env/bin/pip install --quiet -r requirements.txt
          python -m pip install --quiet cyclonedx-bom
          cyclonedx-py environment --pyproject pyproject.toml --of JSON -o sbom.cdx.json /tmp/agent-env/bin/python

      - name: SBOM hochladen
        uses: actions/upload-artifact@v4
        with:
          name: openeos-printer-agent-sbom.cdx.json
          path: sbom.cdx.json
