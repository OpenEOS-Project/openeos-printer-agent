name: Release-Binaerdateien

# Bei einem Tag v* werden PyInstaller-Onefile-Binaerdateien fuer Windows x64,
# Linux x64 und Linux arm64 (Raspberry Pi 4/5, 64-bit OS) gebaut und mit
# SHA256SUMS an ein GitHub-Release gehaengt. arm64 laeuft nativ auf den
# ubuntu-24.04-arm-Runnern (fuer oeffentliche Repos kostenlos), kein QEMU.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: openeos-printer-agent-windows-x64.exe
            requirements: requirements-windows.txt
          - os: ubuntu-24.04
            artifact: openeos-printer-agent-linux-x64
            requirements: requirements.txt
          - os: ubuntu-24.04-arm
            artifact: openeos-printer-agent-linux-arm64
            requirements: requirements.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Systemabhaengigkeiten (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libusb-1.0-0 libjpeg-dev

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }} -r requirements-build.txt
          pip install --no-deps .

      - name: Binaerdatei bauen
        run: pyinstaller --clean --noconfirm openeos-printer-agent.spec

      - name: Rauchtest
        shell: bash
        run: |
          BIN=dist/openeos-printer-agent
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --help

      - name: Umbenennen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/openeos-printer-agent.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/openeos-printer-agent "dist/${{ matrix.artifact }}"
          fi

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub-Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Artefakte holen
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Pruefsummen
        run: |
          cd artifacts
          sha256sum openeos-printer-agent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="OpenEOS Printer Agent ${TAG}

          | Datei | Plattform |
          |---|---|
          | openeos-printer-agent-windows-x64.exe | Windows 10/11 (64-bit) |
          | openeos-printer-agent-linux-x64 | Linux x86_64 |
          | openeos-printer-agent-linux-arm64 | Linux arm64 (Raspberry Pi 4/5, 64-bit OS) |

          Pruefsummen in SHA256SUMS. Installation: siehe README."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES" \
            artifacts/openeos-printer-agent-windows-x64.exe \
            artifacts/openeos-printer-agent-linux-x64 \
            artifacts/openeos-printer-agent-linux-arm64 \
            artifacts/SHA256SUMS
