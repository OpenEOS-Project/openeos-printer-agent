# Haelt Abhaengigkeiten aktuell, ohne dass jemand daran denken muss.
#
# Woechentlich und gruppiert: einzelne PRs je Paket erzeugen so viel Rauschen,
# dass am Ende keiner mehr hinsieht — und genau dann bleiben auch die
# Sicherheitsupdates liegen. Sicherheitsrelevante Aktualisierungen laufen
# ausserhalb dieser Gruppen und erscheinen sofort.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Untergrenzen nur anheben, wenn eine neue Version ausserhalb des
    # erlaubten Bereichs liegt — sonst kommt fuer jede neue Version ein PR.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      # Patches und Minor-Updates gebuendelt — die brechen selten etwas.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major-Updates kommen einzeln: die will man einzeln lesen.
    labels: ["dependencies"]
    ignore:
      # Linux-Builds brauchen altes glibc (requirements-ui.txt): ab 6.10
      # (x86_64) bzw. 6.8.1 (aarch64) setzen die PyPI-Wheels zu neues glibc
      # voraus. Nur von Hand anheben, wenn die Zielsysteme nachziehen.
      - dependency-name: "PySide6-Essentials"
        versions: [">= 6.10"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Das Abbild folgt der neuesten Python-Version aus der CI-Matrix
      # (ci.yml) und dem PyInstaller-Build (release.yml). Neuere Versionen
      # erst, wenn beide sie fuehren.
      - dependency-name: "python"
        versions: [">= 3.13"]
    labels: ["dependencies", "docker"]

  # Die Actions selbst altern genauso — und sie laufen mit Schreibrechten.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
